<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>cod33</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: white;
            font-family: system-ui, -apple-system, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .core {
            max-width: 400px;
            width: 100%;
            background: white;
        }

        .field-label {
            font-size: 0.85rem;
            font-weight: 460;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: #8e8e93;
            margin-bottom: 0.5rem;
        }

        .code-input {
            width: 100%;
            padding: 0.9rem 0.75rem;
            font-size: 1.4rem;
            font-weight: 470;
            font-family: 'SF Mono', 'Fira Code', monospace;
            background: white;
            border: 1px solid #d9d9df;
            border-radius: 14px;
            color: #000;
            outline: none;
            transition: border 0.2s ease;
            letter-spacing: 0.3px;
        }

        .code-input:focus {
            border-color: #007aff;
            box-shadow: 0 0 0 2px rgba(0,122,255,0.1);
        }

        .actions {
            display: flex;
            gap: 0.75rem;
            margin-top: 1.25rem;
            align-items: center;
        }

        .btn {
            border: none;
            background: transparent;
            font-size: 0.95rem;
            font-weight: 500;
            padding: 0.7rem 1.25rem;
            border-radius: 40px;
            cursor: pointer;
            font-family: inherit;
            transition: 0.1s linear;
        }

        .btn-check {
            background: #007aff;
            color: white;
        }

        .btn-check:hover {
            background: #005fc1;
        }

        .btn-check:active {
            transform: scale(0.97);
        }

        .btn-wallet {
            background: #007aff;
            color: white;
        }

        .btn-wallet:hover {
            background: #005fc1;
        }

        .btn-wallet:active {
            transform: scale(0.97);
        }

        .status-line {
            margin-top: 1.2rem;
            font-size: 0.95rem;
            font-weight: 450;
            color: #1c1c1e;
            background: #f9f9fb;
            padding: 0.7rem 0.9rem;
            border-radius: 18px;
            border: 0.5px solid #efeff4;
            min-height: 3.2rem;
            transition: all 0.05s linear;
            white-space: pre-line;
            word-break: break-word;
        }
    </style>
</head>
<body>
<div class="core">
    <div class="field-label">write cod33</div>
    <input type="text" id="codeInput" class="code-input" placeholder="______" maxlength="6" inputmode="numeric" autocomplete="off">

    <div class="actions">
        <button id="checkBtn" class="btn btn-check">check</button>
        <button id="walletBtn" class="btn btn-wallet">wal33t</button>
    </div>

    <div id="statusMessage" class="status-line"></div>
</div>

<script>
    (function() {
        let totalBalance = 0.00;
        const usedCodes = new Set();

        const inputField = document.getElementById('codeInput');
        const checkButton = document.getElementById('checkBtn');
        const walletButton = document.getElementById('walletBtn');
        const statusDiv = document.getElementById('statusMessage');

        function isExactlySixDigits(str) {
            if (!str) return false;
            const trimmed = str.trim();
            if (trimmed.length !== 6) return false;
            for (let i = 0; i < trimmed.length; i++) {
                const ch = trimmed[i];
                if (ch < '0' || ch > '9') return false;
            }
            return true;
        }

        function updateBalanceAndShowSuccess() {
            totalBalance += 0.02;
            totalBalance = Math.round(totalBalance * 100) / 100;
            statusDiv.textContent = "Cod33 right! +0,02";
        }

        function updateWalletDisplay() {
            const formatted = totalBalance.toFixed(2);
            statusDiv.textContent = `walsjj bal ${formatted}`;
        }

        function onCheck() {
            const rawValue = inputField.value;
            const trimmed = rawValue.trim();
            if (trimmed.length !== 6) {
                return;
            }
            let allDigits = true;
            for (let i = 0; i < trimmed.length; i++) {
                if (trimmed[i] < '0' || trimmed[i] > '9') {
                    allDigits = false;
                    break;
                }
            }
            if (!allDigits) {
                return;
            }

            if (usedCodes.has(trimmed)) {
                return;
            }

            usedCodes.add(trimmed);
            updateBalanceAndShowSuccess();
        }

        function onWallet() {
            updateWalletDisplay();
        }

        checkButton.addEventListener('click', onCheck);
        walletButton.addEventListener('click', onWallet);

        inputField.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                onCheck();
            }
        });

        statusDiv.textContent = "";
    })();
</script>
</body>
</html>
